olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen3asr: 1

metadata:
  name: aimqwen3asr
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-qwen3asr/main/icon.png
  description: Qwen3-ASR-1.7B via vLLM - OpenAI-kompatibel
  appid: aimqwen3asr
  title: AIM Qwen3 ASR 1.7B
  version: '1.1.0'
  categories:
    - Audio

entrances:
  - name: aimqwen3asr
    port: 8080
    host: aimqwen3asr
    title: Qwen3-ASR Dashboard
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-qwen3asr/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '1.1.0'
  fullDescription: |
    Qwen3-ASR-1.7B — State-of-the-art Spracherkennung via vLLM mit vollständig OpenAI-kompatiblen Endpunkt für eine vollständig lokale Voice Pipeline auf Olares One.

    Key Features:
    - ASR (Automatic Speech Recognition) / STT (Speech to Text)
    - Spracherkennung: Automatische Identifikation der gesprochene Sprache
    - Sprachunterstützung: 30 Sprachen, inklusive Deutsch und Englisch
    - Robust bei Nebengeräuschen, Akzenten und schwierigen Textstrukturen
    - Dashboard für einfaches Testen
    - Open-Source unter der Apache 2.0 Lizenz

    Endpunkte:
    - /v1/audio/transcriptions (Transkription von Audiodateien in Text)
    - /v1/models (Abfrage verfügbarer Modelle)
    - /v1/chat/completions (Chat-Kompletionen mit Audio-URLs als Input)
  upgradeDescription: |
    1.1.0: Initial Release für Olares One
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-qwen3asr
  sourceCode: https://github.com/bayerhazard/aimighty-qwen3asr
  requiredCpu: "2"
  limitedCpu: "8"
  requiredMemory: 8Gi
  limitedMemory: 16Gi
  requiredDisk: 20Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
