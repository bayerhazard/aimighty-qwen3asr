olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen3asr: 1

metadata:
  name: aimqwen3asr
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-qwen3asr/main/icon.png
  description: Qwen3-ASR 1.7B via vLLM — 30 languages, robust under noise, OpenAI-compatible API
  appid: aimqwen3asr
  title: AIM Qwen3 1.7B ASR
  version: '26.9.10'
  categories:
    - Audio

entrances:
  - name: aimqwen3asr
    port: 8080
    host: aimqwen3asr
    title: AIM Qwen3 1.7B ASR
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-qwen3asr/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.9.10'
  fullDescription: |
    **Qwen3-ASR-1.7B** — Alibaba's state-of-the-art open automatic speech recognition model, served via vLLM with a fully OpenAI-compatible transcription API.

    **Model**
    Qwen/Qwen3-ASR-1.7B (Apache-2.0, commercial use allowed). SOTA among open-source ASR models. Language identification + ASR for 30 languages and 22 Chinese dialects.

    **Inference Engine**
    vLLM (official qwenllm/qwen3-asr image, CUDA 12.8). Native OpenAI-compatible /v1/audio/transcriptions + /v1/chat/completions (audio_url).

    **Key Features**
    - OpenAI-compatible API: /v1/audio/transcriptions, /v1/models
    - Automatic language detection (or force e.g. "German")
    - Robust under noise, accents and challenging text patterns
    - Web dashboard for quick testing (upload/record audio → transcript)

    **API Example**
    curl -X POST http://localhost:8000/v1/audio/transcriptions -H "Content-Type: multipart/form-data" -F "file=@audio.wav" -F "model=qwen3-asr-1.7b" -F "language=German"

    **Resource Usage**
    GPU: 1× NVIDIA (6 GiB HAMi memory slice, co-resident with the other worker-GPU apps)
    RAM: 8 GB, CPU: 2 cores
    Disk: 20 GB (model cache, HF_HOME)
  upgradeDescription: |
    v26.9.10: HAMi memory-slice pinned to 6 GiB (nvidia.com/gpumem) so the RTX 5090 on olares-worker can host OmniVoice TTS, Qwen3-ASR, PaddleOCR and the Qwen3 Reranker co-resident. Built for Olares 1.12.6.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-qwen3asr
  sourceCode: https://github.com/bayerhazard/aimighty-qwen3asr
  requiredCpu: "2"
  limitedCpu: "8"
  requiredMemory: 8Gi
  limitedMemory: 16Gi
  requiredDisk: 20Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
