olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen3asr: 1

metadata:
  name: aimqwen3asr
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-qwen3asr/main/icon.png
  description: Qwen3-ASR 1.7B via vLLM — 30 languages, robust under noise, OpenAI-compatible API
  appid: aimqwen3asr
  title: AIM Qwen3 1.7B ASR
  version: '26.09.4'
  categories:
    - Audio

entrances:
  - name: aimqwen3asr
    port: 8080
    host: aimqwen3asr
    title: AIM Qwen3 1.7B ASR
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-qwen3asr/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.09.4'
  fullDescription: |
    **Qwen3-ASR-1.7B** — Alibaba's state-of-the-art open automatic speech recognition model, served via vLLM with a fully OpenAI-compatible transcription API.

    **Model**
    Qwen/Qwen3-ASR-1.7B (Apache-2.0, commercial use allowed). SOTA among open-source ASR models. Language identification + ASR for 30 languages and 22 Chinese dialects.

    **Inference Engine**
    vLLM (official qwenllm/qwen3-asr image, CUDA 12.8). Native OpenAI-compatible /v1/audio/transcriptions + /v1/chat/completions (audio_url).

    **Key Features**
    - OpenAI-compatible API: /v1/audio/transcriptions, /v1/models
    - Automatic language detection (or force e.g. "German")
    - Robust under noise, accents and challenging text patterns
    - Web dashboard for quick testing (upload/record audio → transcript)

    **API Example**
    curl -X POST http://localhost:8000/v1/audio/transcriptions -H "Content-Type: multipart/form-data" -F "file=@audio.wav" -F "model=qwen3-asr-1.7b" -F "language=German"

    **Resource Usage**
    GPU: 1× NVIDIA (~6-8 GB VRAM via memory slice, co-resident)
    RAM: 8 GB, CPU: 2 cores
    Disk: 20 GB (model cache, HF_HOME)
  upgradeDescription: |
    v26.09.4: verbose_json-Endpunkt via transcribe-parse-Sidecar (ffmpeg-Chunking, 1 Segment pro 30s-Chunk mit echten Timestamps) — macht Insilo/Speaker-Diarization wieder funktionsfähig; json/text/Passthrough unverändert. Built for Olares 1.12.6.
    v26.08.4: VLLM_MAX_AUDIO_CLIP_FILESIZE_MB 25->100 (max. Upload ~52 min @16kHz statt ~13 min; Audio wird in 30s-Chunks verarbeitet, Token-Limit greift nicht). Built for Olares 1.12.6.
    v26.08.3: Revert 5632m -> 6144m (Boot-Crash: bei 5632m nur 0.27 GiB KV, max_model_len 4096 braucht 0.44 GiB). 6144m = Floor (Weights ~5.36 GiB + KV 0.77 GiB). Built for Olares 1.12.6.
    v26.08.2: VRAM-Test: 5632m verworfen (s. v26.08.3).
    v26.08.1: Unified naming — title "AIM Qwen3 1.7B ASR", English descriptions. Built for Olares 1.12.6.
    1.2.1: Sprachauswahl sendet ISO-Codes (de/en/fr) — Fix für vLLM-Sprachvalidierung
    1.2.0: Dashboard im Rewind-Design mit Direktaufnahme (Mikrofon), Sprachumschalter DE/EN und dezenter Konfig-Anzeige
    1.1.0: Initial Release für Olares One
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-qwen3asr
  sourceCode: https://github.com/bayerhazard/aimighty-qwen3asr
  requiredCpu: "2"
  limitedCpu: "8"
  requiredMemory: 8Gi
  limitedMemory: 16Gi
  requiredDisk: 20Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
